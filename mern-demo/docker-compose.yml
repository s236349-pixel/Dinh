services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' || mongo --quiet --eval 'db.runCommand({ ping: 1 }).ok'"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 20s

  backend:
    build: ./server
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5001:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/mern-demo
    env_file:
      - ./server/.env
    restart: on-failure

volumes:
  mongo-data: